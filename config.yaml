# cn-cdn 汇总规则集
- path: output/cn-cdn.mrs
  format: mrs
  behavior: domain
  upstream: &cn_cdn_upstream
    # 1. Apple 中国大陆
    apple_cn:
      type: http
      url: https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/sing/geo/geosite/apple@cn.json
      format: json
      behavior: domain
    # 2. Steam 中国大陆
    steam_cn:
      type: http
      url: https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/sing/geo/geosite/steam@cn.json
      format: json
      behavior: domain
    # 3. Microsoft 中国大陆
    microsoft_cn:
      type: http
      url: https://github.com/MetaCubeX/meta-rules-dat/raw/refs/heads/sing/geo/geosite/microsoft@cn.json
      format: json
      behavior: domain

# 同时生成一份 yaml 明文版本，方便你以后在浏览器或编辑器里查看包含了哪些域名
- path: output/cn-cdn.yaml
  format: yaml
  behavior: classical
  upstream: *cn_cdn_upstream